[workspace]
resolver = "3"
members = ["crates/*", "app"]
exclude = ["patches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
xenify-doc = { path = "crates/xenify-doc" }
xenify-anim = { path = "crates/xenify-anim" }
xenify-ops = { path = "crates/xenify-ops" }
xenify-render = { path = "crates/xenify-render" }
xenify-platform = { path = "crates/xenify-platform" }
xenify-export = { path = "crates/xenify-export" }
xenify-ai = { path = "crates/xenify-ai" }
xenify-ui = { path = "crates/xenify-ui" }
xenify-route = { path = "crates/xenify-route" }
xenify-audio = { path = "crates/xenify-audio" }
xenify-showcase = { path = "crates/xenify-showcase" }
xenify-openrouter = { path = "crates/xenify-openrouter" }
xenify-wp-doc = { path = "crates/xenify-wp-doc" }
xenify-wp-layout = { path = "crates/xenify-wp-layout" }
xenify-wp-engine = { path = "crates/xenify-wp-engine" }
xenify-wp-io = { path = "crates/xenify-wp-io" }
xenify-wp-ui = { path = "crates/xenify-wp-ui" }
xenify-wp-check = { path = "crates/xenify-wp-check" }
xenify-grammar = { path = "crates/xenify-grammar" }
xenify-wp-ai = { path = "crates/xenify-wp-ai" }

kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

# Graphics stack. These must agree on one wgpu version (currently 29):
# vello 0.10 → wgpu 29, eframe/egui-wgpu 0.35 → wgpu 29, egui_dock 0.20 → egui 0.35.
vello = "0.10"
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts", "accesskit", "persistence"] }
egui = "=0.35.0"
egui_dock = { version = "0.20", features = ["serde"] }
pollster = "0.4"
ureq = "3"
base64 = "0.22"
png = "0.18"
# Boolean path operations (curves stay curves); shares kurbo 0.13.
linesweeper = "0.4"
# Raster tracing (image → vector) and image decoding.
vtracer = "0.6"
visioncortex = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# SVG parsing (import); text is converted to outlines with system fonts.
usvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Text layout; 0.11 shares peniko 0.6 with vello 0.10.
parley = { version = "0.11", default-features = false, features = ["std"] }
# Same version Vello uses; for glyph outlines (text → paths).
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# 3D model import: 3MF files are zipped XML.
miniz_oxide = "0.8"
roxmltree = "0.21"
# assets/SOURCES.toml (asset provenance).
toml = "1"
sha2 = "0.11"
# Xenify Write (word processor).
unicode-segmentation = "1"
# Find › Regular expressions (MIT OR Apache-2.0).
regex = "1"
crc32fast = "1"

# Keep debug builds small: full debuginfo made each test binary ~700 MB and
# target/ grew to ~95 GB. Line tables keep file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# MIT stand-ins for unused dependencies that would ship copyleft code
# (ammonia pulls in MPL-2.0 cssparser; colored and option-ext are MPL-2.0). See patches/README.md.
[patch.crates-io]
ammonia = { path = "patches/ammonia" }
colored = { path = "patches/colored" }
option-ext = { path = "patches/option-ext" }

# The browser build (scripts/build-write-web.sh): small downloads first.
# Code is optimised for size, except the maths the mistake spotter runs.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The checker's worker: built for speed (the spotter's maths, the rules).
[profile.web-checker]
inherits = "web"
opt-level = 3

[profile.web.package.candle-core]
opt-level = 3
[profile.web.package.candle-nn]
opt-level = 3
[profile.web.package.candle-transformers]
opt-level = 3
[profile.web.package.gemm-common]
opt-level = 3
[profile.web.package.gemm-f32]
opt-level = 3
