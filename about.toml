# Config for cargo-about, which generates THIRD_PARTY_LICENSES.txt.
# Order matters: for dual-licensed crates ("MIT OR Apache-2.0") the first
# accepted license listed here is the one we use.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "ISC",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Only what ships in the exe; dev/build-only crates aren't distributed.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Tauri's code generator (tauri-macros → tauri-codegen → tauri-utils →
# dom_query) uses these while compiling; none of their code ends up in the
# app (`cargo tree -p xenify-chat-app -e normal,no-proc-macro -i cssparser`
# finds no path). cargo-about counts proc-macro dependencies anyway, so they
# are allowed by name. See patches/README.md.
[cssparser]
accepted = ["MPL-2.0"]
[cssparser-macros]
accepted = ["MPL-2.0"]
[dtoa-short]
accepted = ["MPL-2.0"]
[selectors]
accepted = ["MPL-2.0"]
