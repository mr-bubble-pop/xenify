[package]
name = "xenify-export"
description = "Renders Xenify Draw compositions to video, GIF and image sequences"
version.workspace = true
edition.workspace = true
license.workspace = true

autotests = false

[features]
default = ["gpu"]
# Video, PNG sequences and PDF render offscreen with Vello on the GPU (not in the browser build).
gpu = ["xenify-render/gpu"]

[dependencies]
xenify-util.workspace = true
xenify-anim.workspace = true
xenify-audio.workspace = true
xenify-doc.workspace = true
xenify-platform.workspace = true
xenify-render = { workspace = true, default-features = false }
thiserror.workspace = true
usvg.workspace = true
vtracer.workspace = true
visioncortex.workspace = true
image.workspace = true
kurbo.workspace = true
serde_json.workspace = true
base64.workspace = true
miniz_oxide.workspace = true
roxmltree.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
xenify-ops.workspace = true
sha2.workspace = true

[[test]]
name = "export_tests"
path = "tests/main.rs"
