[package]
name = "xenify-hub-core"
description = "Xenify Hub without its window: signed release lists, channels, the server's update policy, installing and rolling back apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ed25519-dalek = "2"
sha2.workspace = true
base64.workspace = true
semver = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
