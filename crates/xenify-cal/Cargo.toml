[package]
name = "xenify-cal"
description = "Calendars for Xenify Mail: iCalendar (RFC 5545) reading and writing, repeats, time zones, invitations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Dates, times and the IANA time zone database (MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Repeat rules (RRULE), tested against RFC 5545's examples (MIT OR Apache-2.0).
rrule = "0.14"
# The calendars on this computer (SQLite, public domain; rusqlite MIT).
rusqlite = { version = "0.37", features = ["bundled"] }
# Downloading subscribed calendars and CalDAV.
ureq.workspace = true
base64.workspace = true
roxmltree.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
