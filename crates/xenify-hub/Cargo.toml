[package]
name = "xenify-hub"
description = "Xenify Hub: installs and updates Xenify Write, Draw, Chat and the server, on its own or as a Xenify server's admin decides"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xenify-hub"
path = "src/main.rs"

[dependencies]
# Desktop app shell around the system's web view (MIT OR Apache-2.0).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Opening the Hub again (or from an app) brings the running one forward.
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
# Trusting a server's own HTTPS certificate.
xenify-platform = { workspace = true, features = ["trust"] }
xenify-hub-core = { path = "../xenify-hub-core" }
# Signing in to a Xenify server: which protocol version it must speak.
xenify-server-proto = { path = "../xenify-server-proto" }
getrandom = "0.3"
# Comparing its own version with the release list's (self-update).
semver = "1"
# The hour, for updates only at night.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Asked of Windows directly, with no program (or window) in between:
# whether the server it started is running; running a step as administrator.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
