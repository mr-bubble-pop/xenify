[package]
name = "xenify-draw-core"
description = "Xenify Draw's engine for the HTML app: an open canvas, its edits and what the screens ask of it, as JSON calls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xenify-doc.workspace = true
xenify-anim.workspace = true
xenify-ops.workspace = true
xenify-audio.workspace = true
xenify-ai.workspace = true
# SVG, Lottie and traced pictures in and out (no GPU: those parts run in the browser too).
xenify-export = { workspace = true, default-features = false }
xenify-render = { path = "../xenify-render", default-features = false }
kurbo.workspace = true
serde_json.workspace = true
base64.workspace = true
# Raster layers: reading and saving the pixels painted on.
image.workspace = true
# Canvases on a Xenify server: editing together.
xenify-collab = { path = "../xenify-collab" }
