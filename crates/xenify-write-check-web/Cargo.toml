[package]
name = "xenify-write-check-web"
description = "Xenify Write's spelling and grammar checker in the browser: rules, the word Look up and the mistake-spotter model, run in a Web Worker of its own"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xenify-write-host = { path = "../xenify-write-host" }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
getrandom = { version = "0.3", features = ["wasm_js"] }
