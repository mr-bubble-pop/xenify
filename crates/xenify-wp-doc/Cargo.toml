[package]
name = "xenify-wp-doc"
description = "Xenify Write document model: blocks, styles, undoable edits"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
regex.workspace = true
# Local time for date and time fields (MIT/Unlicense).
jiff = "0.2"
# Editing together (no dependencies of its own).
xenify-collab = { path = "../xenify-collab" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's clock and time zone.
jiff = { version = "0.2", features = ["js"] }
