[package]
name = "xenify-safe-html"
description = "Turns untrusted HTML email into a small safe subset: no scripts, no remote content unless allowed, checked links"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The HTML5 parsing algorithm browsers use (MIT OR Apache-2.0), and its
# reference tree (same version).
html5ever = "0.39"
markup5ever_rcdom = "0.39"
url = "2"
idna = "1"
