# Where every asset came from, and the licence it is used under.
#
# This is the single record. It feeds:
#   - the test crates/xenify-export/tests/provenance.rs, which fails when a
#     file under assets/ has no entry, when its SHA-256 no longer matches, or
#     when its licence isn't one we accept (see ACCEPTED in
#     crates/xenify-export/src/sources.rs);
#   - Help › Credits & Licences in the app (compiled in at build time);
#   - scripts/licenses.sh, which appends each licence_file to
#     THIRD_PARTY_LICENSES.txt.
#
# One [[asset]] per bundled file (or file group), per on-demand download, and
# per piece of generated media or built-in artwork.
#
# Fields:
#   path          the file under assets/ (absent for artwork that only lives in code)
#   name          what it is, as shown in the credits
#   source        "download" (default) or "generated"
#   source_url    where it was downloaded from (download)
#   generator     the code that makes it (generated): a path, plus the function
#   version       release, commit or font version
#   license       SPDX id
#   license_file  the licence text, itself listed below
#   attribution   the exact credit text, when the licence needs one
#   fetched       date it was downloaded or generated (YYYY-MM-DD)
#   sha256        of the file at `path` (`sha256sum <file>`)
#   notes         changes we made (subset, recompression…), and for generated
#                 media a statement that no third-party material was used
#
# Adding an asset: prefer MIT, Apache-2.0, BSD, ISC, Zlib, CC0-1.0 or OFL-1.1.
# Anything CC BY needs visible attribution. Downloaded sets come from a fetch
# script (scripts/fetch-*.sh) that pins the URL or commit, checks the hash and
# writes the entry here; nothing is copied in by hand.

